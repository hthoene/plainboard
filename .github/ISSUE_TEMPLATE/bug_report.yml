name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project …
        2. Hand ticket #1 to the manager …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs app runner --tail 100`. Remove tokens and other secrets first.
      render: text
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main @ abc1234
  - type: dropdown
    id: os
    attributes:
      label: Host OS
      options: [Windows, macOS, Linux, Other]
