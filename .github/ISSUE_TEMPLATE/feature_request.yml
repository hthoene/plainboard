name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could PlainBoard solve it? Keep token efficiency in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
