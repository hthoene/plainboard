name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app's suite on SQLite and on PostgreSQL, each in two halves on machines of their own (conftest.py,
  # PLAINBOARD_TEST_SHARD), each half with one test process per CPU (pytest -n auto, pytest-xdist).
  backend-part:
    name: Backend tests (${{ matrix.database }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 8  # a half takes about 2 with the build; a test that hangs fails after 2 (pytest-timeout)
    strategy:
      fail-fast: false
      matrix:
        database: [SQLite, PostgreSQL]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      # Started first: it comes up while the image builds. A database thrown away after the run: in memory and
      # without waiting for the disk (fsync), which the tests never notice.
      # With pgvector, which semantic search needs (app services/search; its tests run only here).
      - name: Start PostgreSQL
        if: matrix.database == 'PostgreSQL'
        run: |
          docker network create ci
          docker run -d --name db --network ci --tmpfs /var/lib/postgresql/data -e POSTGRES_USER=plainboard -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=plainboard \
            pgvector/pgvector:pg17 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - name: Build backend image
        run: docker build -f app/Dockerfile --target backend -t plainboard-app:ci .
      - name: Wait for PostgreSQL
        if: matrix.database == 'PostgreSQL'
        run: until docker exec db pg_isready -U plainboard -d plainboard; do sleep 1; done
      # With PLAINBOARD_DATABASE set, every test starts with an empty PostgreSQL database (each test process has one of its own).
      - name: Run tests
        run: >-
          docker run --rm -w /src/app -e PLAINBOARD_TEST_SHARD=${{ matrix.shard }}/2
          ${{ matrix.database == 'PostgreSQL' && '--network ci -e PLAINBOARD_DATABASE=postgresql://plainboard:ci@db:5432/plainboard' || '' }}
          plainboard-app:ci python -m pytest -q -n auto

  # The check the base branch requires by this name: green when every part above is.
  backend:
    name: Backend tests
    needs: backend-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.backend-part.result }}" = success

  runner:
    name: Runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The image's slow layers (system packages, Chromium, the Codex CLI) change rarely and are taken
      # from what the last publish built (publish.yml writes this cache); only the code is built here.
      - uses: docker/setup-buildx-action@v3
      - name: Build runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runner/Dockerfile
          tags: plainboard-runner:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=plainboard-runner-amd64
      - name: Run tests
        run: docker run --rm -w /src/runner plainboard-runner:ci python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: The compose file in the README is deploy/docker-compose.yml
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          shown = re.search(r"```yaml\n(.*?)```", pathlib.Path("README.md").read_text(encoding="utf-8"), re.S).group(1)
          sys.exit(0 if shown.strip() == pathlib.Path("deploy/docker-compose.yml").read_text(encoding="utf-8").strip() else "README.md and deploy/docker-compose.yml differ")
          EOF
