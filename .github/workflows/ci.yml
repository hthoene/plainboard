name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f app/Dockerfile --target backend -t plainboard-app:ci .
      - name: Run tests
        run: docker run --rm -w /src/app plainboard-app:ci python -m pytest -q

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f app/Dockerfile --target backend -t plainboard-app:ci .
      - name: Start PostgreSQL
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_USER=plainboard -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=plainboard postgres:17
          until docker exec db pg_isready -U plainboard -d plainboard; do sleep 1; done
      # The same suite: with PLAINBOARD_DATABASE set, every test starts with an empty PostgreSQL database.
      - name: Run tests
        run: docker run --rm --network ci -e PLAINBOARD_DATABASE=postgresql://plainboard:ci@db:5432/plainboard -w /src/app plainboard-app:ci python -m pytest -q

  runner:
    name: Runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runner image
        run: docker build -f runner/Dockerfile -t plainboard-runner:ci .
      - name: Run tests
        run: docker run --rm -w /src/runner plainboard-runner:ci python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: The compose file in the README is deploy/docker-compose.yml
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          shown = re.search(r"```yaml\n(.*?)```", pathlib.Path("README.md").read_text(encoding="utf-8"), re.S).group(1)
          sys.exit(0 if shown.strip() == pathlib.Path("deploy/docker-compose.yml").read_text(encoding="utf-8").strip() else "README.md and deploy/docker-compose.yml differ")
          EOF
