[project]
name = "plainboard"
version = "0.1.0"
description = "PlainBoard: minimal Kanban + AI agent team orchestration"
requires-python = ">=3.12"
dependencies = [
    "plainboard-protocol",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",  # PostgreSQL, for whoever sets PLAINBOARD_DATABASE
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "croniter>=3.0",
    "tzdata>=2024.1",
]

[project.scripts]
plainboard = "plainboard.migrate:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-xdist>=3.6", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plainboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
# A test that hangs fails after two minutes with every thread's stack (pytest-timeout) instead of keeping its
# CI job silent. "thread": it also ends a test stuck in C code (a database call waiting for a lock); its
# worker process is replaced (pytest-xdist) and the others go on.
timeout = 120
timeout_method = "thread"
