# PlainBoard. Start and update with the same command:
#
#   docker compose up -d --build
#
# Then open http://localhost:8080. Everything else is set in the browser.
# The few things that are not (a server, a folder of your machine) are explained in .env.example.

# Container output is kept in a few small files, not one that grows for ever.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # The web UI and everything PlainBoard does by itself.
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: plainboard-app
    restart: unless-stopped
    logging: *logging
    ports:
      - "${PLAINBOARD_BIND:-127.0.0.1}:${PLAINBOARD_PORT:-8080}:8080"
    environment:
      PLAINBOARD_PASSWORD: ${PLAINBOARD_PASSWORD:-}
      # Security (docs/guide.md, "Security"): previews on a name of their own, and HTTPS behind a proxy.
      PLAINBOARD_PREVIEW_ORIGIN: ${PLAINBOARD_PREVIEW_ORIGIN:-}
      PLAINBOARD_PREVIEW_SANDBOX: ${PLAINBOARD_PREVIEW_SANDBOX:-false}
      PLAINBOARD_SECURE_COOKIES: ${PLAINBOARD_SECURE_COOKIES:-}
      PLAINBOARD_HSTS: ${PLAINBOARD_HSTS:-true}
      PLAINBOARD_ALLOWED_ORIGINS: ${PLAINBOARD_ALLOWED_ORIGINS:-}
      # Empty: SQLite in the data volume. Or your PostgreSQL: postgresql://user:password@host:5432/name
      PLAINBOARD_DATABASE: ${PLAINBOARD_DATABASE:-}
      PLAINBOARD_RUNNER_URL: http://runner:8090
      PLAINBOARD_INTERNAL_URL: http://app:8080
      PLAINBOARD_UPDATE_REPOSITORY: ${PLAINBOARD_UPDATE_REPOSITORY:-hthoene/plainboard}
      # Fallbacks for credentials that are normally entered in the browser. Prefixed in .env on
      # purpose, so keys that happen to be exported in your shell are never picked up silently.
      CLAUDE_CODE_OAUTH_TOKEN: ${PLAINBOARD_CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${PLAINBOARD_ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${PLAINBOARD_OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${PLAINBOARD_GITHUB_TOKEN:-}
    volumes:
      - data:/data
      - uploads:/uploads
    depends_on:
      runner:
        condition: service_healthy

  # Where the agents work: their shell, their tools, your code. Only the app talks to it.
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
      args:
        PLAINBOARD_BROWSER: ${PLAINBOARD_BROWSER:-1}
    image: plainboard-runner
    restart: unless-stopped
    logging: *logging
    # A model server on this machine (Ollama, LM Studio ...) is reached as host.docker.internal, on Linux too.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${PLAINBOARD_WORKSPACES_DIR:-workspaces}:/workspaces
      - uploads:/uploads:ro
      - agent-home:/home/agent

volumes:
  data: # the database and the key your secrets are encrypted with: back this up
  uploads:
  workspaces:
  agent-home:
