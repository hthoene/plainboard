<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PlainBoard</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        text-align: center;
        background: Canvas;
        color: CanvasText;
      }
      h1 { margin: 0; font-size: 18px; }
      p { margin: 0; font-size: 14px; opacity: 0.7; }
      button {
        margin-top: 8px;
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>PlainBoard is not reachable</h1>
    <p>Check your connection, or whether the server is running.</p>
    <button onclick="location.href = '/'">Try again</button>
  </body>
</html>
