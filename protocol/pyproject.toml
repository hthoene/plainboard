[project]
name = "plainboard-protocol"
version = "0.1.0"
description = "Shared wire protocol between the PlainBoard app and runner"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plainboard_protocol"]
